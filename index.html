<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus · n8n</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f3d1a;
      --ink-soft: #2d6b3a;
      --ink-ghost: #7aab84;
      --surface: #ffffff;
      --surface-2: #f0f7f1;
      --surface-3: #dff0e3;
      --accent: #0f3d1a;
      --accent-line: rgba(15,61,26,0.10);
      --blue: #c0392b;
      --blue-soft: #fdf0ef;
      --radius: 18px;
      --radius-sm: 10px;
      --send-size: 44px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #e8f5eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* — outer shell — */
    .shell {
      width: 420px;
      max-width: 100%;
      background: var(--surface);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 680px;
      max-height: 96vh;
      box-shadow: 0 2px 1px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.10), 0 32px 64px rgba(0,0,0,.08);
      position: relative;
    }

    /* — header — */
    .header {
      padding: 20px 22px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--accent-line);
      background: #0f3d1a;
      position: relative;
      z-index: 10;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .avatar svg { width: 18px; height: 18px; }

    .header-info { flex: 1; }
    .header-name {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .header-status {
      font-size: 12px;
      color: #a8d5b0;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .btn-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a8d5b0;
      transition: background .15s, color .15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.12); color: #ffffff; }

    /* messages — */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }

    /* date divider */
    .divider {
      text-align: center;
      font-size: 11px;
      color: var(--ink-ghost);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.4px;
      margin: 10px 0;
    }

    /* rows */
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.user-row { justify-content: flex-end; }
    .row.bot-row { justify-content: flex-start; }

    .mini-avatar {
      width: 28px; height: 28px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-avatar.bot { background: #fff; border: 1px solid rgba(0,0,0,0.08); }
    .mini-avatar.user { display: none; }
    .mini-avatar svg { width: 14px; height: 14px; }

    /* bubble */
    .bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: -0.1px;
      border-radius: 18px;
      word-break: break-word;
      animation: pop .2s cubic-bezier(.34,1.56,.64,1) both;
      max-width: 75%;
    }
    
    .bubble ol, .bubble ul {
      margin: 8px 0;
      padding-left: 20px;
    }
    .bubble li {
      margin: 5px 0;
      line-height: 1.5;
    }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; }
    .bubble p { margin: 6px 0; }
    .bubble code {
      background: rgba(0,0,0,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
    }
    
    @keyframes pop {
      from { opacity: 0; transform: scale(.92) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bubble.bot {
      background: var(--surface-2);
      color: var(--ink);
      border-bottom-left-radius: 6px;
      align-self: flex-start;
    }
    .bubble.user {
      background: #0f3d1a;
      color: #ffffff;
      border-bottom-right-radius: 6px;
      align-self: flex-end;
    }
    .bubble.bot code {
      background: rgba(15,61,26,0.15);
    }
    .bubble.user code {
      background: rgba(255,255,255,0.25);
    }
    .bubble.system {
      background: #fdf0ef;
      color: #c0392b;
      font-size: 13px;
      border-radius: var(--radius-sm);
      align-self: center;
    }

    /* consecutive bubbles — tighten gap */
    .row + .row.bot-row  { margin-top: 2px; }
    .row + .row.user-row { margin-top: 2px; }

    /* hide avatar on consecutive same-sender messages */
    .row.consecutive .mini-avatar { opacity: 0; pointer-events: none; }
    .row.consecutive .bubble.bot  { border-top-left-radius: 6px; }
    .row.consecutive .bubble.user { border-top-right-radius: 6px; }

    /* — typing — */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: pop .2s ease both;
    }
    .typing-bubble {
      background: var(--surface-2);
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      padding: 13px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .typing-bubble span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ink-ghost);
      animation: bounce 1.2s infinite ease;
    }
    .typing-bubble span:nth-child(2) { animation-delay: .15s; }
    .typing-bubble span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity:.4; }
      40%          { transform: translateY(-5px); opacity:1; }
    }

    /* — input bar — */
    .input-bar {
      padding: 14px 16px 18px;
      background: var(--surface);
      border-top: 1px solid var(--accent-line);
    }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border-radius: 16px;
      padding: 6px 6px 6px 16px;
      transition: box-shadow .2s;
    }
    .input-wrap:focus-within {
      box-shadow: 0 0 0 2px #0f3d1a;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      letter-spacing: -0.1px;
    }
    .input-wrap input::placeholder { color: var(--ink-ghost); }
    .send-btn {
      width: var(--send-size); height: var(--send-size);
      border-radius: 12px;
      background: #0f3d1a;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #1a5c2a; }
    .send-btn:active { transform: scale(.94); }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* — settings overlay — */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .settings-card {
      background: var(--surface);
      border-radius: 22px;
      border: 1px solid var(--accent-line);
      padding: 26px 22px;
      width: 100%;
      transform: translateY(12px);
      transition: transform .25s cubic-bezier(.34,1.3,.64,1);
    }
    .overlay.open .settings-card { transform: translateY(0); }

    .settings-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .settings-sub {
      font-size: 13px;
      color: var(--ink-ghost);
      margin-bottom: 20px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .6px;
      display: block;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--accent-line);
      border-radius: 12px;
      padding: 11px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 12.5px;
      color: var(--ink);
      background: var(--surface-2);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: #0f3d1a;
      box-shadow: 0 0 0 3px rgba(15,61,26,.10);
    }
    .field p {
      font-size: 12px;
      color: var(--ink-ghost);
      margin-top: 7px;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-ghost {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid var(--accent-line);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-primary {
      flex: 2;
      padding: 11px;
      border-radius: 12px;
      border: none;
      background: #0f3d1a;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary:hover { background: #1a5c2a; }
  </style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="avatar">
<img src="ypippilogo.jpeg" style="width:100%;height:100%;object-fit:contain;border-radius:inherit;" alt="YP IPPI">
    </div>
    <div class="header-info">
      <div class="header-name">Nexus</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>Terhubung ke n8n</span>
      </div>
    </div>
    <button class="btn-icon" onclick="toggleSettings()" title="Pengaturan">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="divider">Hari ini</div>
    <div class="row bot-row">
      <div class="mini-avatar bot">
        <img src="ypippilogo.jpeg" style="width:100%;height:100%;object-fit:contain;" alt="YP IPPI">
      </div>
      <div class="bubble bot">
        Halo! Saya Nexus, asisten AI Anda. Hubungkan dengan n8n melalui menu pengaturan untuk memulai.
      </div>
    </div>
  </div>

  <!-- Typing indicator (hidden) -->
  <div class="typing-row" id="typing" style="display:none; padding: 0 18px 8px;">
    <div class="mini-avatar bot">
      <img src="ypippilogo.jpeg" style="width:100%;height:100%;object-fit:contain;" alt="YP IPPI">
    </div>
    <div class="typing-bubble">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <form id="form">
      <div class="input-wrap">
        <input type="text" id="inp" autocomplete="off" placeholder="Ketik pesan…" />
        <button type="submit" class="send-btn" id="send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Settings overlay -->
  <div class="overlay" id="overlay">
    <div class="settings-card">
      <div class="settings-title">Pengaturan Koneksi</div>
      <div class="settings-sub">Masukkan URL Webhook dari workflow n8n Anda.</div>
      <div class="field">
        <label>Webhook URL</label>
        <input type="url" id="wh-url" placeholder="https://n8n.domain.com/webhook/…" />
        <p>Node Webhook n8n harus menggunakan metode POST.</p>
      </div>
      <div class="settings-actions">
        <button class="btn-ghost" onclick="toggleSettings()">Batal</button>
        <button class="btn-primary" onclick="saveSettings()">Simpan</button>
      </div>
    </div>
  </div>

</div>
<script src="backend.js"></script>
</body>
</html>
